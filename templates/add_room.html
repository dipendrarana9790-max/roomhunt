{% extends "owner_base.html" %}

{% block title %}
Add Room
{% endblock %}

{% block heading %}
Add New Room
{% endblock %}

{% block content %}

<style>
.form-wrapper{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px 0;
}

.room-form{
    width:100%;
    max-width:850px;
    background:#fff;
    padding:35px;
    border-radius:12px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.room-form h2{
    text-align:center;
    color:#2c3e50;
    margin-bottom:30px;
}

.form-row{
    display:flex;
    gap:20px;
    margin-bottom:20px;
    align-items: flex-end; /* Aligns the button cleanly with fields */
}

.form-group{
    flex:1;
}

.form-group.full{
    width:100%;
    margin-bottom:20px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#34495e;
}

.form-group input,
.form-group textarea{
    width:100%;
    padding:12px;
    border:1px solid #dcdde1;
    border-radius:6px;
    font-size:15px;
    transition:.3s;
}

.form-group input:focus,
.form-group textarea:focus{
    border-color:#3498db;
    outline:none;
    box-shadow:0 0 5px rgba(52,152,219,.3);
}

.form-group textarea{
    height:120px;
    resize:none;
}

/* Added Styling for Location Button */
.btn-location {
    padding: 12px 15px;
    background: #2ecc71;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: .3s;
    white-space: nowrap;
    height: 47px; /* Matches input height perfectly */
}

.btn-location:hover {
    background: #27ae60;
}

.btn-submit{
    width:100%;
    padding:14px;
    background:#3498db;
    color:white;
    border:none;
    border-radius:6px;
    font-size:17px;
    cursor:pointer;
    transition:.3s;
}

.btn-submit:hover{
    background:#2980b9;
}
</style>

<div class="form-wrapper">
    <div class="room-form">
        <h2>🏠 Add New Room</h2>

        <form method="POST" enctype="multipart/form-data">
            <div class="form-row">
                <div class="form-group">
                    <label>Room Title</label>
                    <input type="text" name="title" placeholder="Enter room title" required>
                </div>

                <div class="form-group">
                    <label>Price (Rs.)</label>
                    <input type="number" name="price" placeholder="Enter price" required>
                </div>
            </div>

            <div class="form-group full">
                <label>Description</label>
                <textarea name="description" placeholder="Describe your room..." required></textarea>
            </div>

            <div class="form-group full">
                <label>Address</label>
                <input type="text" name="address" placeholder="Enter full address" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Latitude</label>
                    <input type="text" id="latitude" name="latitude" placeholder="27.717245" required>
                </div>

                <button type="button" class="btn-location" onclick="getLocation()">
                    📍 Get My Location
                </button>

                <div class="form-group">
                    <label>Longitude</label>
                    <input type="text" id="longitude" name="longitude" placeholder="85.323960" required>
                </div>
            </div>

            <div class="form-group full">
                <label>Room Image</label>
                <input type="file" name="room_image" required>
            </div>

            <button class="btn-submit">
                ➕ Add Room
            </button>
        </form>
    </div>
</div>

<script>
function getLocation() {
    if (navigator.geolocation) {
        // Change button text to show loading status
        const btn = document.querySelector('.btn-location');
        btn.innerText = "⏳ Fetching...";
        btn.disabled = true;

        navigator.geolocation.getCurrentPosition(
            function(position) {
                // Successfully received coordinates
                document.getElementById('latitude').value = position.coords.latitude.toFixed(6);
                document.getElementById('longitude').value = position.coords.longitude.toFixed(6);
                
                // Reset button state
                btn.innerText = "📍 Location Found";
                btn.disabled = false;
                setTimeout(() => { btn.innerText = "📍 Get My Location"; }, 3000);
            }, 
            function(error) {
                // Error handling (e.g., user denied location access)
                alert("Error: " + error.message + ". Please ensure location permissions are granted.");
                btn.innerText = "📍 Get My Location";
                btn.disabled = false;
            }
        );
    } else {
        alert("Geolocation is not supported by this browser.");
    }
}
</script>

{% endblock %}
